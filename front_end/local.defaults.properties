# Fallback values for the Secrets Gradle Plugin, used when local.properties has no value.
# Put the real key in front_end/local.properties (not versioned):
# MAPS_API_KEY=your_google_maps_key
MAPS_API_KEY=DEFAULT_API_KEY

# Backend base URL. 10.0.2.2 is the host machine as seen from the Android emulator.
# For a real device use your PC's LAN IP and add it to res/xml/network_security_config.xml.
API_BASE_URL=http://10.0.2.2:9000/
